<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office Presence 2026: frames (days and corrections)</title>
<style>
/* ===== Document chrome (switcher) ===== */
:root{
  --c-bg:#F4F4F4; --c-panel:#FFFFFF; --c-line:rgba(26,26,26,.10); --c-ink:#1A1A1A; --c-ink2:#5E5E5E; --c-ink3:#8C8C8C;
  --c-canvas:#E6E6E6; --c-sel:rgba(253,81,8,.15);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--c-bg:#1A1A1A;--c-panel:#2D2D2D;--c-line:rgba(255,255,255,.10);--c-ink:#F4F4F4;--c-ink2:#B3B3B3;--c-ink3:#808080;--c-canvas:#121212;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 "Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;background:var(--c-bg);color:var(--c-ink)}
.shell{display:grid;grid-template-columns:280px 1fr;height:100vh}
.layers{background:var(--c-panel);border-right:1px solid var(--c-line);overflow:auto;padding:16px 10px 40px}
.layers .file{font-weight:700;padding:4px 10px 14px;display:flex;align-items:center;gap:8px}
.layers .file i{width:14px;height:14px;border-radius:4px;background:#FD5108;display:inline-block}
.layers h2{font-size:12px;font-weight:600;color:var(--c-ink3);margin:16px 10px 6px}
.layers button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--c-ink2);font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;cursor:pointer}
.layers button:hover{color:var(--c-ink)}
.layers button[aria-current="true"]{background:var(--c-sel);color:var(--c-ink);font-weight:600}
.layers button:focus-visible,.bar-top button:focus-visible{outline:2px solid #FD5108;outline-offset:1px}
.stage{display:flex;flex-direction:column;min-width:0}
.bar-top{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--c-line);background:var(--c-panel)}
.bar-top .name{font-weight:700;font-size:15px}
.bar-top .note{color:var(--c-ink2);font-size:13px;flex:1;min-width:0}
.bar-top .ctl{display:flex;gap:6px;align-items:center}
.bar-top button{border:1px solid var(--c-line);background:var(--c-bg);color:var(--c-ink);font:inherit;font-size:12.5px;padding:5px 11px;border-radius:999px;cursor:pointer}
.bar-top button[aria-pressed="true"]{background:var(--c-ink);color:var(--c-bg)}
.canvas{flex:1;overflow:auto;background:var(--c-canvas);display:flex;justify-content:center;align-items:flex-start;padding:28px}
.scaler{transform-origin:top center}
.scaler > .fr{box-shadow:0 0 0 1px var(--c-line)}
body.export .shell{display:none}
#export{position:absolute;left:0;top:0}

/* ===== Design tokens (frames) ===== */
.fr{
  --font:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;
  --bg:#F4F4F4; --surface:#FFFFFF; --sunk:#ECECEC; --line:rgba(26,26,26,.10); --line2:rgba(26,26,26,.18);
  --ink:#1A1A1A; --ink2:#5E5E5E; --ink3:#8C8C8C;
  --accent:#FD5108; --accent-h:#E04A07; --wash:rgba(253,81,8,.15); --on-accent:#1A1A1A;
  --ok:#2ECC71; --ok-wash:rgba(46,204,113,.16);
  --scrim:rgba(26,26,26,.32);
  --map-land:#ECECE9; --map-road:#FFFFFF; --map-block:#E2E2DE; --map-water:#DADADA;
  font-family:var(--font); background:var(--bg); color:var(--ink); position:relative; overflow:hidden;
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
.fr.dark{
  --bg:#1A1A1A; --surface:#2D2D2D; --sunk:#242424; --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --ink:#F4F4F4; --ink2:#B3B3B3; --ink3:#808080; --scrim:rgba(0,0,0,.5);
  --map-land:#262626; --map-road:#363636; --map-block:#2E2E2E; --map-water:#1F1F1F;
  color-scheme:dark;
}
.fr *{box-sizing:border-box}
.fr button{font:inherit;color:inherit}

/* motion: quiet status change, points fill */
@keyframes st-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fill{from{width:0}}
.sw,.sw-web{animation:st-in .32s cubic-bezier(.2,.7,.2,1) both}
.bar > i{animation:fill .9s cubic-bezier(.2,.7,.2,1) .12s both}
.noanim .sw,.noanim .sw-web,.noanim .bar > i{animation:none}
@media (prefers-reduced-motion:reduce){.sw,.sw-web,.bar > i{animation:none}}

/* type */
.t-status{font-size:112px;font-weight:800;letter-spacing:-.045em;line-height:.86}
.t-num{font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.t-title{font-size:28px;font-weight:700;letter-spacing:-.015em;line-height:1.15}
.t-h{font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.t-body{font-size:16px}
.t-label{font-size:14px;font-weight:500}
.t-meta{font-size:12.5px;color:var(--ink2)}
.ink2{color:var(--ink2)}.ink3{color:var(--ink3)}
.b6{font-weight:600}.b7{font-weight:700}
.tab{font-variant-numeric:tabular-nums}

/* layout helpers */
.row{display:flex;align-items:center;gap:12px}
.btw{display:flex;align-items:center;justify-content:space-between;gap:12px}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hair{height:1px;background:var(--line)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px}
.card.r16{border-radius:16px}
.card.tight{padding:4px 20px}
.sunk{background:var(--sunk);border-radius:16px}

/* badges */
.bdg{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.bdg .d{width:8px;height:8px;border-radius:50%}
.bdg.in{background:var(--ok-wash)} .bdg.in .d{background:var(--ok)}
.bdg.out{background:var(--sunk);color:var(--ink2)} .bdg.out .d{background:var(--ink3)}
.bdg.met{background:var(--ok);color:#1A1A1A}
.bdg.attn{background:var(--wash)} .bdg.attn .d{background:var(--accent)}
.bdg.sm{height:24px;font-size:12px;padding:0 10px}
.fyi{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:6px;border:1px solid var(--line2);font-size:11px;font-weight:600;color:var(--ink2);letter-spacing:.02em}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot.in{background:var(--ok)}.dot.out{background:var(--ink3)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;border:1px solid transparent;font-size:16px;font-weight:600;white-space:nowrap;cursor:pointer;background:none}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-h)}
.btn.sec{border-color:var(--line2);background:var(--surface)}
.btn.ghost{color:var(--ink);padding:0 4px;height:auto;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px;text-decoration-thickness:2px}
.btn.sm{height:36px;padding:0 16px;font-size:14px}
.btn.xs{height:30px;padding:0 12px;font-size:13px}
.btn.block{width:100%}
.btn.dis{opacity:.4;pointer-events:none}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(26,26,26,.25);border-top-color:#1A1A1A;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.noanim .spin{animation:none}

/* days meter */
.meter .mtop{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.meter .mnum{font-size:56px}
.meter .mden{font-size:18px;font-weight:500;color:var(--ink2);margin-left:6px}
.meter .togo{font-size:15px;font-weight:600;color:var(--ink2);padding-bottom:6px}
.meter .bar{margin-top:14px}
.bar{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar > i{display:block;height:100%;width:var(--w);background:var(--accent);border-radius:999px}
.meter.lg .mnum{font-size:72px}
.meter.md .mnum{font-size:44px}.meter.md .mden{font-size:16px}
.meter .sub{margin-top:10px;font-size:13px;color:var(--ink2)}
.mini{display:flex;align-items:center;gap:10px}
.mini .bar{width:64px;height:6px}
.mini .v{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

/* fields */
.field{display:block}
.field .lab{font-size:13px;font-weight:500;color:var(--ink2);margin-bottom:8px;display:block}
.input{height:52px;border:1px solid var(--line2);border-radius:14px;background:var(--surface);display:flex;align-items:center;padding:0 16px;font-size:16px}
.input.plh{color:var(--ink3)}
.input.focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--wash)}
.input.sm{height:40px;border-radius:12px;font-size:14px;padding:0 12px}
.otp{display:flex;gap:8px}
.otp span{flex:1;height:60px;border:1px solid var(--line2);border-radius:14px;display:grid;place-items:center;font-size:24px;font-weight:700;background:var(--surface)}
.otp span.cur{border-color:var(--ink);box-shadow:0 0 0 3px var(--wash)}
.otp.err span{border-color:var(--accent)}
.msg-err{display:flex;gap:10px;align-items:flex-start;background:var(--wash);border-radius:14px;padding:12px 14px;font-size:14px}
.msg-err b{display:block}
.switch{width:44px;height:26px;border-radius:999px;background:var(--line2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.switch.on{background:var(--accent)}.switch.on::after{left:21px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px;background:var(--surface);font-size:13px}
.seg span{padding:5px 14px;border-radius:999px;color:var(--ink2)}
.seg span.on{background:var(--ink);color:var(--bg);font-weight:600}
.sel{height:36px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);display:inline-flex;align-items:center;gap:8px;padding:0 12px;font-size:13.5px}
.av{width:36px;height:36px;border-radius:50%;background:var(--sunk);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none;color:var(--ink2)}
.av.lg{width:48px;height:48px;font-size:16px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:18px;height:18px}
.sk{background:var(--sunk);border-radius:10px}

/* ===== Phone ===== */
.ph{width:390px;height:844px;display:flex;flex-direction:column}
.sbar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:600}
.sbar .r{display:flex;gap:6px;align-items:center;color:var(--ink2)}
.pbody{flex:1;min-height:0;padding:6px 24px 20px;display:flex;flex-direction:column;overflow:hidden}
.ptop .t-meta{white-space:nowrap}
.ptop{display:flex;align-items:center;justify-content:space-between;height:44px;flex:none}
.wm{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.wm i{width:16px;height:16px;border-radius:4px;background:var(--accent);display:inline-block}
.wm.lg{font-size:18px}.wm.lg i{width:20px;height:20px;border-radius:5px}
.bnav{flex:none;height:88px;border-top:1px solid var(--line);background:var(--surface);display:flex;justify-content:space-around;padding-top:10px}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:4px;width:84px;font-size:12px;font-weight:500;color:var(--ink2);text-decoration:none}
.bnav a .pill{width:64px;height:32px;border-radius:999px;display:grid;place-items:center}
.bnav a.on{color:var(--ink);font-weight:700}
.bnav a.on .pill{background:var(--wash)}
.bnav a.on .ic{stroke:var(--accent)}
.gest{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:120px;height:4px;border-radius:2px;background:var(--ink3);opacity:.5}
.phead{display:flex;align-items:center;gap:8px;height:56px;flex:none}
.phead .t-title{font-size:26px}
.lst > .it{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.lst > .it:first-child{border-top:0}
.sec-h{font-size:13px;font-weight:600;color:var(--ink2);margin:20px 4px 8px}
.setr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line);font-size:15px}
.setr:first-child{border-top:0}
.setr .v{font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px;text-align:center}
.cal .h{font-size:12px;color:var(--ink3);font-weight:600;padding-bottom:4px}
.cal .d{height:40px;display:grid;place-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.cal .d span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;position:relative}
.cal .d.we{color:var(--ink3)}
.cal .d.fut{color:var(--ink3)}
.cal .d.v span{background:var(--accent);color:#1A1A1A;font-weight:700}
.cal .d.p2 span::after{content:"2";position:absolute;top:-3px;right:-3px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:1px solid var(--line2);color:var(--ink);font-size:10px;font-weight:700;display:grid;place-items:center}
.cal .d.today span{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.cal .d.sel span{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:24px 24px 0 0;padding:12px 24px 32px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 18px}
.banner{background:var(--wash);border-radius:20px;padding:18px 20px}

/* ===== Web ===== */
.wb{width:1440px;min-height:1000px;display:grid;grid-template-columns:248px 1fr}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;gap:2px;min-height:1000px}
.rail .wm{padding:0 12px 28px}
.rail a{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:12px;color:var(--ink2);text-decoration:none;font-size:14.5px;font-weight:500}
.rail a.on{background:var(--wash);color:var(--ink);font-weight:700}
.rail a.on .ic{stroke:var(--accent)}
.rail .grp{font-size:12px;font-weight:600;color:var(--ink3);padding:22px 12px 8px}
.rail .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:14px 12px 0;border-top:1px solid var(--line);font-size:13px}
.wmain{padding:36px 36px 48px}
.wwrap{max-width:1120px;margin:0 auto}
.whead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}
.whead .t-title{font-size:32px}
.strip{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:20px;margin-bottom:20px}
.strip > div{flex:1;padding:18px 22px;border-left:1px solid var(--line)}
.strip > div:first-child{border-left:0}
.strip .n{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.strip .l{font-size:13px;color:var(--ink2);margin-top:8px;display:flex;align-items:center;gap:7px}
.strip > div.on{box-shadow:inset 0 -3px 0 var(--accent)}
.filters{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.search{height:36px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);display:inline-flex;align-items:center;gap:8px;padding:0 12px;font-size:13.5px;color:var(--ink3);width:280px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:13.5px}
.chk i{width:18px;height:18px;border-radius:5px;background:var(--accent);position:relative;display:inline-block}
.chk i::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #1A1A1A;border-width:0 2px 2px 0;transform:rotate(45deg)}
.chk.off i{background:none;border:1.5px solid var(--line2)}.chk.off i::after{display:none}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12.5px;font-weight:600;color:var(--ink2);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
.r{text-align:right}
td .p2{font-size:12.5px;color:var(--ink2)}
.drawer{position:absolute;top:0;right:0;bottom:0;width:420px;background:var(--surface);border-left:1px solid var(--line);padding:32px 32px;box-shadow:-16px 0 40px rgba(0,0,0,.08)}
.wcal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wcal .h{font-size:12.5px;color:var(--ink3);font-weight:600;padding:0 10px}
.wcal .d{height:104px;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;font-size:14px;font-variant-numeric:tabular-nums}
.wcal .d.we{background:transparent;color:var(--ink3)}
.wcal .d.fut{color:var(--ink3)}
.wcal .d.v{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wcal .d .pt{display:inline-flex;align-self:flex-start;align-items:center;height:22px;padding:0 9px;border-radius:999px;background:var(--accent);color:#1A1A1A;font-size:12px;font-weight:700}
.wcal .d .of{font-size:12px;color:var(--ink2)}
.wcal .d.today{border:2px solid var(--ink)}
.wcal .d.sel{background:var(--wash)}
.wcal .d.blank{border:0;background:none}
.kv{display:grid;grid-template-columns:260px 1fr;border-top:1px solid var(--line)}
.kv > div{padding:18px 0;border-bottom:1px solid var(--line);font-size:15px;display:flex;align-items:center}
.kv .k{flex-direction:column;align-items:flex-start;justify-content:center}
.kv .k small{color:var(--ink2);font-size:13px;margin-top:2px}
.map{position:relative;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--map-land)}
.map svg{display:block;width:100%;height:100%}
.mapctl{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mapctl span{width:36px;height:36px;display:grid;place-items:center;font-size:18px;font-weight:600}
.mapctl span+span{border-top:1px solid var(--line)}
.mapsearch{position:absolute;left:16px;top:16px;width:320px}
.mapsearch .search{width:100%;background:var(--surface)}
.mapnote{position:absolute;left:16px;bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12.5px;color:var(--ink2)}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.ocard.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.ocard .meta{display:flex;gap:18px;margin-top:10px;font-size:13px;color:var(--ink2)}
.ocard .meta b{color:var(--ink);font-weight:600}
.lcard{width:440px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:40px}

/* ===== Corrections ===== */
.opt{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.opt.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.opt .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);flex:none;margin-top:1px}
.opt.on .radio{border:6px solid var(--accent)}
.opt b{font-size:15px;display:block}
.ta{border:1px solid var(--line2);border-radius:14px;background:var(--surface);padding:12px 14px;font-size:15px;min-height:96px}
.ta.ph0{color:var(--ink3)}
.cmp{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.cmp > div{padding:14px 16px}
.cmp > div + div{border-left:1px solid var(--line)}
.cmp .h{font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.cmp .req{background:var(--wash)}

/* ---------- components ---------- */
const badge=(s,sm)=>{
  const z=sm?' sm':'';
  if(s==='in') return `<span class="bdg in${z}"><span class="d"></span>In</span>`;
  if(s==='out') return `<span class="bdg out${z}"><span class="d"></span>Out</span>`;

  if(s==='stale') return `<span class="bdg attn${z}"><span class="d"></span>No recent sync</span>`;

};
const rqb=(s,sm=true)=>{const z=sm?' sm':'';
  if(s==='pending') return `<span class="bdg attn${z}"><span class="d"></span>Pending review</span>`;
  if(s==='approved') return `<span class="bdg out${z}" style="color:var(--ink)">${ic('check','ic s')}Approved</span>`;
  if(s==='rejected') return `<span class="bdg out${z}">Not approved</span>`;
  if(s==='cancelled') return `<span class="bdg out${z}">Cancelled</span>`;
  return '';};

  return `<div class="meter ${size}">

};

function phoneCal(v,{today=27,sel=null,pend=null}={}){
  const h=['M','T','W','T','F','S','S'].map(x=>`<div class="h">${x}</div>`).join('');
  let cells='';
  for(let i=0;i<3;i++) cells+='<div></div>';
  for(let d=1;d<=31;d++){
    const dow=(d+2)%7; // 0=Mon
    const cls=['d']; if(dow>=5)cls.push('we'); if(d>today)cls.push('fut');
    if(v[d]){cls.push('v'); if(v[d]>1)cls.push('p2');}
    if(d===today)cls.push('today'); if(d===sel)cls.push('sel'); if(d===pend)cls.push('pend');
    cells+=`<div class="${cls.join(' ')}"><span>${d}</span></div>`;
  }
  return `<div class="cal">${h}${cells}</div>`;
}
function webCal(v,{today=27,sel=null,pend=null}={}){
  const offs={5:OFF.kol,19:OFF.gb,6:OFF.gb,8:OFF.gb,14:OFF.kol,15:OFF.gb,21:OFF.gb,22:OFF.gb,23:OFF.gb,27:OFF.gb};
  const h=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="h">${x}</div>`).join('');
  let cells='';
  for(let i=0;i<3;i++) cells+='<div class="d blank"></div>';
  for(let d=1;d<=31;d++){
    const dow=(d+2)%7, cls=['d'];
    if(dow>=5)cls.push('we'); if(d>today)cls.push('fut'); if(v[d])cls.push('v');
    if(d===today)cls.push('today'); if(d===sel)cls.push('sel'); if(d===pend)cls.push('pend');
    const multi={21:'2 offices'};
    const inner=d===pend&&!v[d]?`<span class="of" style="color:var(--ink)">Pending review</span>`:v[d]?`<span class="pt">${v[d]} ${v[d]>1?'days':'day'}</span><span class="of ell">${d===today?'In now':(multi[d]||offs[d].split(',')[0])}</span>`:'';
    cells+=`<div class="${cls.join(' ')}"><span>${d}</span><div class="col" style="gap:4px">${inner}</div></div>`;
  }
  return `<div class="wcal">${h}${cells}</div>`;
}

/* ---------- FLOW ---------- */
const FLOW=()=>`<div class="fd">
  <div class="t-title" style="font-size:40px">Correction request flow</div>
  <p class="ink2" style="margin:10px 0 40px;max-width:70ch">How an employee asks to change one day, and how an admin decides. Totals never change until a request is approved.</p>
  <div class="flow" style="grid-template-columns:1fr 40px 1fr 40px 1fr 40px 1fr">
    <div class="fstep"><div class="who">Employee, phone or web</div><b>1. Open the day</b><p>Month, tap a day, Request a correction. Days in a locked month have no button.</p></div>
    <div class="farrow">${ic('chev')}</div>
    <div class="fstep"><div class="who">Employee</div><b>2. Describe the change</b><p>Pick the issue, set office and In and Out times, add a reason, review the effect, Send request.</p></div>
    <div class="farrow">${ic('chev')}</div>
    <div class="fstep" style="border-color:var(--accent)"><div class="who">System</div><b>3. Pending review</b><p>Day shows a dashed outline. Admins see it in Corrections with a count. Employee can Cancel request.</p></div>
    <div class="farrow">${ic('chev')}</div>
    <div class="fstep"><div class="who">Admin, web only</div><b>4. Review</b><p>Recorded vs requested, reason, phone sync for that day, effect on the month. Can edit before approving.</p></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px">
    <div class="fstep"><div class="row btw"><b style="margin:0">5a. Approve</b>${rqb('approved')}</div><p style="margin-top:8px">The day is updated and marked Corrected. Month, roster and reports recalculate. The original record and who approved it are kept. Employee gets a notification.</p></div>
    <div class="fstep"><div class="row btw"><b style="margin:0">5b. Reject</b>${rqb('rejected')}</div><p style="margin-top:8px">A note is required. The day stays as recorded. Employee sees the note and can send a new request while the window is open.</p></div>
  </div>
  <div class="card" style="margin-top:40px"><div class="t-h" style="margin-bottom:10px">Rules</div>
   <div class="lst" style="font-size:15px">
    <div class="it">One open request per day. To change it, cancel it and send a new one.</div>
    <div class="it">Requests close 5 days after month end (set in Rules). After that the month is locked for everyone.</div>
    <div class="it">Any admin can decide, except on their own requests.</div>
    <div class="it">Pending requests never change points counted, the roster or reports.</div>
    <div class="it">Every decision stores who, when, the note, and the before and after values. Person visits shows Corrected rows.</div>
    <div class="it">Admins never see coordinates in a review. Only office, times, and phone sync times.</div>
   </div></div>
</div>`;

/* ---------- switcher ---------- */
let cur=0, theme='light', fit=true;
const slug=n=>n.replace(/\s*\/\s*/g,'-').replace(/[(),]/g,'').replace(/\s+/g,'-');
function frameHTML(f,forceTheme){const t=f.th||forceTheme||'light';return `<div class="fr ${t}" data-frame="${f.n}" style="width:${f.w||390}px">${f.r()}</div>`;}
function buildLayers(){
  const el=document.getElementById('layers'); let html='<div class="file"><i></i>Office Presence 2026</div>', pg='';
  F.forEach((f,i)=>{ if(f.pg!==pg){pg=f.pg; html+=`<h2>${pg}</h2>`;} html+=`<button type="button" data-i="${i}">${f.n}</button>`; });
  el.innerHTML=html;
  el.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>show(+b.dataset.i)));
}
function layout(){
  const sc=document.getElementById('scaler'), cv=document.getElementById('canvas'), fr=sc.firstElementChild; if(!fr)return;
  const w=fr.offsetWidth; const avail=cv.clientWidth-56;
  const s=fit?Math.min(1,avail/w):1; sc.style.transform=`scale(${s})`; sc.style.height=(fr.offsetHeight*s)+'px'; sc.style.width=(w*s)+'px';
  sc.style.transformOrigin='top left';
}
function show(i){
  cur=(i+F.length)%F.length; const f=F[cur];
  document.getElementById('scaler').innerHTML=frameHTML(f,theme);
  document.getElementById('fname').textContent=f.n;
  document.getElementById('fnote').textContent=f.note||'';
  document.querySelectorAll('#layers button').forEach(b=>b.setAttribute('aria-current',String(+b.dataset.i===cur)));
  history.replaceState(null,'','#'+encodeURIComponent(f.n));
  layout();
}
document.querySelectorAll('[data-th]').forEach(b=>b.addEventListener('click',()=>{theme=b.dataset.th;document.querySelectorAll('[data-th]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));show(cur);}));
document.getElementById('fit').addEventListener('click',e=>{fit=!fit;e.currentTarget.setAttribute('aria-pressed',String(fit));layout();});
document.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();show(cur+1)} if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();show(cur-1)}});
window.addEventListener('resize',layout);
buildLayers();
const start=decodeURIComponent(location.hash.slice(1)); const si=F.findIndex(f=>f.n===start); show(si>=0?si:0);

/* export hook */
window.__frames=F.map(f=>({n:f.n,slug:slug(f.n),note:f.note||''}));
window.__render=function(i){document.body.classList.add('export');const ex=document.getElementById('export');ex.innerHTML=frameHTML(F[i],'light');ex.firstElementChild.classList.add('noanim');return ex.firstElementChild.getBoundingClientRect().height;};
</script>
